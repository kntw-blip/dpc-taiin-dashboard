name: build-and-publish
# raw ブランチの一次データ → 開設者照合 → JSON加工 → gh-pages ブランチへ公開
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, scripts/**, data/**, .github/workflows/build.yml]
  workflow_run:
    workflows: [fetch-raw]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: raw, path: raw }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install python-calamine dbfread
      - name: Build data
        run: |
          mkdir -p work site/data
          python scripts/kousei_parse.py raw/kousei work/kousei_hosp.csv 2>&1 | tee build_log.txt
          python scripts/match_owner.py "$(ls raw/dpc/*施設概要表*)" work/kousei_hosp.csv raw/geo/A38-20_1.dbf work/match.csv 2>&1 | tee -a build_log.txt
          python scripts/build_data.py raw work/match.csv data/owner_override.csv site/data 2>&1 | tee -a build_log.txt
          echo "::notice title=build::$(tail -c 2500 build_log.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "publish $(date -u +%F)"
          git -c http.postBuffer=524288000 push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
